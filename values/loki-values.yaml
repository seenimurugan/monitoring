---
# Loki — SingleBinary mode for a single-node homelab.
# Filesystem storage on local-path SSD, 7-day retention.

deploymentMode: SingleBinary

loki:
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  schemaConfig:
    configs:
      - from: "2024-04-01"
        store: tsdb
        object_store: filesystem
        schema: v13
        index:
          prefix: index_
          period: 24h
  storage:
    type: filesystem
  pattern_ingester:
    enabled: false
  limits_config:
    allow_structured_metadata: true
    volume_enabled: true
    retention_period: 168h   # 7 days
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  ruler:
    enable_api: true

# --- SingleBinary deployment ---
singleBinary:
  replicas: 1
  persistence:
    enabled: true
    storageClass: local-path
    size: 20Gi
  resources:
    requests:
      memory: "256Mi"
      cpu: "100m"
    limits:
      memory: "1Gi"

# --- Disable scalable-mode pods (we're using SingleBinary) ---
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
ingester:
  replicas: 0
querier:
  replicas: 0
queryFrontend:
  replicas: 0
queryScheduler:
  replicas: 0
distributor:
  replicas: 0
compactor:
  replicas: 0
indexGateway:
  replicas: 0
bloomCompactor:
  replicas: 0
bloomGateway:
  replicas: 0

# --- Disable gateway (Nginx) — direct service access is enough for homelab ---
gateway:
  enabled: false

# --- Disable internal monitoring sub-charts (we use kube-prometheus-stack) ---
monitoring:
  selfMonitoring:
    enabled: false
    grafanaAgent:
      installOperator: false
  lokiCanary:
    enabled: false
test:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
