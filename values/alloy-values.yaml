---
# Grafana Alloy — log + metrics collector DaemonSet.
# Configured here only for log scraping → Loki (kube-prometheus-stack handles
# the Prometheus side via scrape configs/ServiceMonitors).
#
# Auto-discovers every pod in the cluster, tails /var/log/pods/**/*.log,
# and forwards to Loki with these labels:
#   namespace, pod, container, node, app (from pod label "app")

alloy:
  configMap:
    create: true
    content: |-
      logging {
        level  = "info"
        format = "logfmt"
      }

      // Discover all pods in the cluster
      discovery.kubernetes "pods" {
        role = "pod"
      }

      // Build the per-target log file paths + labels
      discovery.relabel "pod_logs" {
        targets = discovery.kubernetes.pods.targets

        // namespace
        rule {
          source_labels = ["__meta_kubernetes_namespace"]
          action        = "replace"
          target_label  = "namespace"
        }
        // pod name
        rule {
          source_labels = ["__meta_kubernetes_pod_name"]
          action        = "replace"
          target_label  = "pod"
        }
        // container name
        rule {
          source_labels = ["__meta_kubernetes_pod_container_name"]
          action        = "replace"
          target_label  = "container"
        }
        // node
        rule {
          source_labels = ["__meta_kubernetes_pod_node_name"]
          action        = "replace"
          target_label  = "node"
        }
        // app label — prefer "app", fall back to "app.kubernetes.io/instance"
        // (which is what Helm-installed apps like Immich/Jellyfin use).
        // Two rules: the second only fires when the first didn't set "app".
        rule {
          source_labels = ["__meta_kubernetes_pod_label_app"]
          action        = "replace"
          target_label  = "app"
        }
        rule {
          source_labels = ["app", "__meta_kubernetes_pod_label_app_kubernetes_io_instance"]
          regex         = ";(.+)"
          action        = "replace"
          target_label  = "app"
          replacement   = "$1"
        }
        // job = namespace/app for default Loki dashboards
        rule {
          source_labels = ["__meta_kubernetes_namespace", "app"]
          action        = "replace"
          target_label  = "job"
          separator     = "/"
          replacement   = "$1/$2"
        }
      }

      // Tail container logs on this node
      loki.source.kubernetes "pods" {
        targets    = discovery.relabel.pod_logs.output
        forward_to = [loki.write.default.receiver]
      }

      // Ship to in-cluster Loki SingleBinary service
      loki.write "default" {
        endpoint {
          url = "http://loki.${MONITORING_NAMESPACE}.svc.cluster.local:3100/loki/api/v1/push"
        }
      }

controller:
  type: daemonset

# Resources (per-node)
resources:
  requests:
    memory: "128Mi"
    cpu: "50m"
  limits:
    memory: "512Mi"

# Don't run a separate metrics-cluster — only logs.
crds:
  create: false

serviceMonitor:
  enabled: false
