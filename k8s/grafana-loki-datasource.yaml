---
# Loki datasource for Grafana — discovered by the Grafana sidecar via the
# grafana_datasource=1 label.
# deploy.sh runs this through envsubst — ${MONITORING_NAMESPACE} is expanded
# from .env at apply time (default: monitoring).
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-datasource
  namespace: ${MONITORING_NAMESPACE}
  labels:
    grafana_datasource: "1"
data:
  loki-datasource.yaml: |-
    apiVersion: 1
    datasources:
      - name: Loki
        type: loki
        access: proxy
        url: http://loki.monitoring.svc.cluster.local:3100
        isDefault: false
        editable: true
        jsonData:
          maxLines: 5000
