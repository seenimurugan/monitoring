---
# Tailscale HTTPS Ingress for Grafana
# Result: https://grafana.stoat-perch.ts.net (from any tailnet device)
# deploy.sh runs this through envsubst — ${GRAFANA_INGRESS_HOST} and
# ${MONITORING_NAMESPACE} are expanded from .env at apply time.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: grafana
  namespace: ${MONITORING_NAMESPACE}
spec:
  ingressClassName: tailscale
  defaultBackend:
    service:
      name: grafana
      port:
        number: 80
  tls:
    - hosts:
        - ${GRAFANA_INGRESS_HOST}
