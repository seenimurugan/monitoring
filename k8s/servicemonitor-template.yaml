---
# Template: scrape an app's Prometheus metrics endpoint.
# Copy this, replace <app> + <port-name> + <path>, kubectl apply.
#
# Example for a Spring Boot app exposing /actuator/prometheus on port 8080:
#   name: chores
#   selector: app=chores
#   port name: http (must match the named port on the Service)
#   path: /actuator/prometheus
#
# Once applied, Prometheus picks it up within ~1 min. Verify with:
#   kubectl port-forward -n monitoring svc/kps-prometheus 9090 &
#   open http://localhost:9090/targets
#
# NOTE: This file is NOT applied by deploy.sh. It is a reference template for
# opting individual apps into Prometheus scraping. Copy it into the app's own
# repo/manifests directory and apply it there.
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: <app>
  namespace: <app-namespace>   # the namespace where the app lives, e.g. homelab
  labels:
    app: <app>
spec:
  selector:
    matchLabels:
      app: <app>
  endpoints:
    - port: <port-name>          # named port on the Service
      path: <path>                # e.g. /actuator/prometheus, /metrics
      interval: 30s
      scrapeTimeout: 10s
